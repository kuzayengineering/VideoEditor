# Automatic builds.
#
# On every push:  check the code, run the tests and build the Android app.
#                 The Windows program is built only when asked for ("[windows]"
#                 in the commit message, or "Run workflow" by hand) and once a
#                 month on the 1st, because Windows build time counts double
#                 towards the free minutes. Releases are never deleted, so the
#                 newest Windows program always stays downloadable.
# On the main (default) branch: also publish a GitHub Release with the files
#                 attached. Obtainium watches these releases and offers each
#                 new one as an update on your phone.
#
# The version number is <major.minor from pubspec.yaml>.<build number>, e.g.
# 0.1.7. It goes up by one with every build, which is what Obtainium and
# Android use to recognise an update.

name: Build

on:
  push:
  workflow_dispatch:
  # Once a month (the 1st, early morning UTC), when the free minutes have
  # reset: a release that includes a fresh Windows program.
  schedule:
    - cron: "23 6 1 * *"

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.9"
  # FFmpeg for the Windows version: one exact, pinned build (LGPL, with
  # Intel/NVIDIA/AMD hardware encoders) from BtbN/FFmpeg-Builds. Its SHA-256
  # fingerprint is checked before use. The first build stores a copy as a
  # pre-release in this repository (tag below), and later builds use that
  # copy, so the file can never change or disappear.
  FFMPEG_ZIP: ffmpeg-n8.1.3-34-ga35157abb9-win64-lgpl-8.1.zip
  FFMPEG_SHA256: 7bdec3860d33145a7cd68146eb8e1414e8881cac76205401211fbdad38ef0ed3
  FFMPEG_UPSTREAM: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-11-09-12-42
  FFMPEG_MIRROR_TAG: tools-ffmpeg-n8.1.3

jobs:
  check:
    name: Check code and run tests
    runs-on: ubuntu-latest
    # A stuck build machine can't use up more than this.
    timeout-minutes: 30
    permissions:
      contents: write # to start the (draft) release the builds attach to
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      windows: ${{ steps.version.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Work out version number
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          base=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version: *([0-9]+\.[0-9]+)\..*/\1/')
          echo "version=${base}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          # Releases come only from the main (default) branch, and not when
          # the commit message says "[no release]" (work in progress).
          if [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ] && \
             ! printf '%s' "$MESSAGE" | grep -qF '[no release]'; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          # The Windows build counts double towards GitHub's free minutes,
          # so it only runs when asked for: "[windows]" in the commit
          # message, or a build started by hand.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             [ "${{ github.event_name }}" = "schedule" ] || \
             printf '%s' "$MESSAGE" | grep -qF '[windows]'; then
            echo "windows=true" >> "$GITHUB_OUTPUT"
          else
            echo "windows=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Build the caption engine (for its test)
        run: |
          cmake -S native/captions -B build/captions -DCMAKE_BUILD_TYPE=Release
          cmake --build build/captions -j4
      - run: flutter test
        env:
          VC_CAPTIONS_LIB: ${{ github.workspace }}/build/captions/libvc_captions.so
      # The builds attach their files straight to a draft release (hidden
      # from Obtainium until published), instead of storing them as Actions
      # artifacts: the free account has only 500 MB for those.
      - name: Start the draft release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Remove drafts left behind by failed builds (over 3 hours old).
          cutoff=$(date -u -d '3 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          gh release list --limit 50 --json tagName,isDraft,createdAt \
            --jq ".[] | select(.isDraft and .createdAt < \"$cutoff\") | .tagName" |
            while read -r tag; do gh release delete "$tag" --yes || true; done
          gh release create "v$VERSION" --draft \
            --target "${{ github.sha }}" \
            --title "Video Editor $VERSION" \
            --notes "Being built…"

  android:
    name: Build Android app
    needs: check
    runs-on: ubuntu-latest
    # A stuck build machine can't use up more than this.
    timeout-minutes: 30
    permissions:
      contents: write # to attach the app to the release
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - id: key
        name: Load signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ⚠️ Android app built with a temporary key"
              echo "The signing secrets are not set up, so no release was published."
              echo "See docs/UPDATES.md for the one-time setup."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build APK
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm64 \
            --build-name="$VERSION" --build-number="${{ github.run_number }}" \
            --dart-define=APP_VERSION="$VERSION"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "dist/VideoEditor-$VERSION-android-arm64.apk"
      - name: Attach to the release
        if: needs.check.outputs.publish == 'true' && steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "v$VERSION" "dist/VideoEditor-$VERSION-android-arm64.apk" --clobber
          # The key for reading Android error reports (crash locations).
          map=build/app/outputs/mapping/release/mapping.txt
          if [ -f "$map" ]; then gh release upload "v$VERSION" "$map" --clobber; fi

  windows:
    name: Build Windows program
    needs: check
    if: needs.check.outputs.windows == 'true'
    runs-on: windows-latest
    # A stuck build machine can't use up more than this.
    timeout-minutes: 30
    permissions:
      # To store the pinned FFmpeg copy the first time, and to attach the
      # program to the release.
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        shell: pwsh
        run: |
          flutter build windows --release `
            --build-name="$env:VERSION" --build-number="${{ github.run_number }}" `
            --dart-define=APP_VERSION="$env:VERSION"
      - name: Add FFmpeg (pinned, fingerprint-checked)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $zip = $env:FFMPEG_ZIP
          $fromMirror = $true
          gh release download $env:FFMPEG_MIRROR_TAG --pattern $zip 2>$null
          if (-not (Test-Path $zip)) {
            $fromMirror = $false
            Invoke-WebRequest "$env:FFMPEG_UPSTREAM/$zip" -OutFile $zip
          }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:FFMPEG_SHA256) { throw "FFmpeg fingerprint mismatch: $hash" }
          if (-not $fromMirror) {
            gh release create $env:FFMPEG_MIRROR_TAG $zip --prerelease --latest=false `
              --title "FFmpeg 8.1.3 (build tool, not an app release)" `
              --notes "Pinned copy of $zip (SHA-256 $env:FFMPEG_SHA256) used to build the Windows version."
          }
          Expand-Archive $zip -DestinationPath ffmpeg-dl
          $exe = Get-ChildItem ffmpeg-dl -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $dest = "build/windows/x64/runner/Release/ffmpeg"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item $exe.FullName $dest
          Copy-Item (Join-Path $exe.DirectoryName "ffprobe.exe") $dest
          $license = Get-ChildItem ffmpeg-dl -Recurse -Filter "LICENSE*" | Select-Object -First 1
          if ($license) { Copy-Item $license.FullName "$dest/LICENSE.txt" }
          $encoders = & "$dest/ffmpeg.exe" -hide_banner -encoders
          foreach ($needed in @("hevc_qsv", "hevc_nvenc", "hevc_amf", "h264_qsv")) {
            if (-not ($encoders | Select-String $needed)) { throw "FFmpeg build lacks $needed" }
          }
          $filters = & "$dest/ffmpeg.exe" -hide_banner -filters
          if (-not ($filters | Select-String " zscale ")) { throw "FFmpeg build lacks zscale" }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $folder = "VideoEditor-$env:VERSION-windows-x64"
          Copy-Item -Recurse build/windows/x64/runner/Release "dist/$folder"
          Compress-Archive -Path "dist/$folder" -DestinationPath "dist/$folder.zip"
      - name: Attach to the release
        if: needs.check.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "v$env:VERSION" "dist/VideoEditor-$env:VERSION-windows-x64.zip" --clobber

  release:
    name: Publish release
    needs: [check, android, windows]
    # Only from the main (default) branch, and only with the real signing key,
    # so every release can update the previous one. A commit message with
    # "[no release]" builds and tests without publishing (work in progress).
    # (Runs when the Windows build was skipped too: then the release has
    # just the Android app.)
    if: >-
      always() &&
      needs.check.result == 'success' &&
      needs.android.result == 'success' &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped') &&
      needs.check.outputs.publish == 'true' &&
      needs.android.outputs.signed == 'true'
    runs-on: ubuntu-latest
    # A stuck build machine can't use up more than this.
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          {
            echo "${COMMIT_MESSAGE:-Manual build}"
            echo
            echo "---"
            echo "- **Android:** \`VideoEditor-$VERSION-android-arm64.apk\` (Obtainium installs this automatically)"
            if [ "${{ needs.windows.result }}" = "success" ]; then
              echo "- **Windows:** download the \`.zip\`, unzip it, and run \`video_editor.exe\`"
            else
              echo "- **Windows:** not built this time (see an earlier release, or build it on request)"
            fi
          } > notes.md
          gh release edit "v$VERSION" --draft=false --latest \
            --title "Video Editor $VERSION" \
            --notes-file notes.md
