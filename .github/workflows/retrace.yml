# Turns a scrambled Android error report (from the app's "Copy the details")
# back into readable code locations, using the code map attached to the
# version's release (mapping.txt).
name: Read error report

on:
  workflow_dispatch:
    inputs:
      version:
        description: App version the report came from (for example 0.3.41)
        required: true
      trace:
        description: The copied error text
        required: true

permissions:
  contents: read

jobs:
  retrace:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code map
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v${{ inputs.version }}" \
            --repo "${{ github.repository }}" --pattern mapping.txt --dir map
      - name: Decode
        env:
          TRACE: ${{ inputs.trace }}
        run: |
          grep -m1 "pg_map_id" map/mapping.txt || true
          printf '%s\n' "$TRACE" | sed 's/ at /\n    at /g' > trace.txt
          RETRACE=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/retrace | head -1)
          echo "Using $RETRACE"
          "$RETRACE" map/mapping.txt trace.txt
