# Memory for the Android build tools. The automatic build machines have
# 16 GB in all; with 8 GB here (and as much again for the Kotlin compiler,
# plus the speech engine's C++ compiles) a build could run the machine out
# of memory, and GitHub then loses contact with it.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m
kotlin.daemon.jvmargs=-Xmx2G
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
